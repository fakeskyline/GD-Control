name: Build GD Control (Android ARM64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GD Control (Android64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          android-min-sdk: 23

      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: GD-Control-Android64
          path: output/*.geode
          if-no-files-found: error
          retention-days: 14
